spring:
  application:
    name: manufacturing-erp

  # PostgreSQL connection + HikariCP pool
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}
      pool-name: HikariPool-ERP

  # JPA / Hibernate — schema is validated only, never auto-generated (Flyway owns schema)
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  # Schema migrations
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Redis — token store, session state, rate-limit counters
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      timeout: ${REDIS_TIMEOUT:2000ms}
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1

  # File upload limits (spreadsheet import endpoint)
  servlet:
    multipart:
      enabled: true
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:12MB}

  # JSON wire format for all API responses
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

# HTTP server
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,text/html,text/xml
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

# Actuator health/info endpoints, served on a separate port
management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8081}
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_EXPOSURE_INCLUDE:health,info}
  endpoint:
    health:
      show-details: ${MANAGEMENT_HEALTH_SHOW_DETAILS:never}
  info:
    env:
      enabled: true

# OpenAPI / Swagger UI (disabled by default, enable per environment)
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}

# Logging pattern + per-package log levels
logging:
  pattern:
    console: "%d{ISO8601} [%X{traceId}] [%X{userId}] [%X{clientIp}] %-5level [%thread] %logger{36} - %msg%n"
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.erp.manufacturing: ${LOG_LEVEL_APP:INFO}
    org.hibernate.SQL: ${LOG_LEVEL_HIBERNATE_SQL:WARN}
    org.hibernate.orm.jdbc.bind: ${LOG_LEVEL_HIBERNATE_BIND:WARN}

# App-specific custom properties
app:
  # First-run admin account creation (disabled by default — see AdminBootstrapService)
  bootstrap:
    admin:
      enabled: ${APP_BOOTSTRAP_ADMIN_ENABLED:false}
      username: ${APP_BOOTSTRAP_ADMIN_USERNAME:admin}
      email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
      password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}

  # JWT token issuance + expiry
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER}
    audience: ${JWT_AUDIENCE}
    access-token-expiry-ms: ${JWT_ACCESS_TOKEN_EXPIRY_MS:900000}
    refresh-token-expiry-ms: ${JWT_REFRESH_TOKEN_EXPIRY_MS:604800000}
    absolute-session-timeout-ms: ${JWT_ABSOLUTE_SESSION_TIMEOUT_MS:2592000000}

  # Trusted reverse-proxy IPs (for resolving real client IP)
  security:
    trusted-proxies: ${SECURITY_TRUSTED_PROXIES}

  # CORS — exact origins only, wildcard rejected at startup (credentialed requests)
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PATCH,PUT,DELETE,OPTIONS}
    allowed-headers: ${CORS_ALLOWED_HEADERS:Authorization,Content-Type,Idempotency-Key,X-Plant-Id,X-Trace-Id}
    exposed-headers: ${CORS_EXPOSED_HEADERS:X-Trace-Id,X-RateLimit-Limit,X-RateLimit-Remaining,X-RateLimit-Rule,Retry-After}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}
    max-age-seconds: ${CORS_MAX_AGE_SECONDS:3600}

  # Spreadsheet import row limit (synchronous apply path)
  data-import:
    max-rows: ${DATA_IMPORT_MAX_ROWS:5000}

  # Redis sliding-window rate limiting, per IP/user and per route pattern
  rate-limit:
    enabled: true
    rules:
      - id: global-ip
        scope: IP
        pattern: "/**"
        limit: ${RATE_LIMIT_GLOBAL_IP_LIMIT:200}
        window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
        action: BLOCK

      - id: auth-ip
        scope: IP
        pattern: "/auth/v1/**"
        limit: ${RATE_LIMIT_AUTH_IP_LIMIT:10}
        window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
        action: BLOCK

      - id: auth-refresh-ip
        scope: IP
        pattern: "/auth/v1/refresh"
        limit: ${RATE_LIMIT_REFRESH_IP_LIMIT:20}
        window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
        action: BLOCK

      - id: global-user
        scope: USER
        pattern: "/**"
        limit: ${RATE_LIMIT_GLOBAL_USER_LIMIT:500}
        window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
        action: BLOCK
