spring:
  application:
    name: manufacturing-erp

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}
      pool-name: HikariPool-ERP

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      timeout: ${REDIS_TIMEOUT:2000ms}
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1

  servlet:
    # Spreadsheet import (POST /api/v1/import-runs) is the only multipart endpoint in this API.
    # 10 MB is well above a master-data sheet of the row limit the importer enforces
    # (app.data-import.max-rows) and low enough that a stray upload cannot exhaust the heap.
    multipart:
      enabled: true
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:12MB}

  jackson:
    # These settings were dead until 2026-08-12: an @Bean ObjectMapper in RedisConfig overrode Boot's
    # auto-configured one, so nothing here applied (debt #27). See RedisConfig's javadoc.
    #
    # `always` is deliberate and NOT the same as the `non_null` written here before. Letting `non_null`
    # take effect would have dropped every null field from every nested DTO in one go — a payload change
    # on all endpoints that no client asked for. The frontend asked only for ISO dates, so null handling
    # stays exactly as it has always been on the wire. Switching to `non_null` is a separate, coordinated
    # decision. (The envelope is unaffected either way: ApiResponse carries its own @JsonInclude(NON_NULL),
    # which is why `result`/`errors` already disappear when null.)
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false   # LocalDate -> "2026-08-15", Instant -> "2026-08-03T08:00:00Z"
    deserialization:
      fail-on-unknown-properties: false  # now effective; unknown request fields are ignored, not rejected

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,text/html,text/xml
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8081}
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_EXPOSURE_INCLUDE:health,info}
  endpoint:
    health:
      show-details: ${MANAGEMENT_HEALTH_SHOW_DETAILS:never}
  info:
    env:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}

logging:
  pattern:
    console: "%d{ISO8601} [%X{traceId}] [%X{userId}] [%X{clientIp}] %-5level [%thread] %logger{36} - %msg%n"
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.erp.manufacturing: ${LOG_LEVEL_APP:INFO}
    org.hibernate.SQL: ${LOG_LEVEL_HIBERNATE_SQL:WARN}
    org.hibernate.orm.jdbc.bind: ${LOG_LEVEL_HIBERNATE_BIND:WARN}

# ── App custom properties ──────────────────────────────────────────────────
app:
  bootstrap:
    admin:
      enabled: ${APP_BOOTSTRAP_ADMIN_ENABLED:false}
      username: ${APP_BOOTSTRAP_ADMIN_USERNAME:admin}
      email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
      password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}

  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER}
    audience: ${JWT_AUDIENCE}
    access-token-expiry-ms: ${JWT_ACCESS_TOKEN_EXPIRY_MS:900000}
    refresh-token-expiry-ms: ${JWT_REFRESH_TOKEN_EXPIRY_MS:604800000}
    absolute-session-timeout-ms: ${JWT_ABSOLUTE_SESSION_TIMEOUT_MS:2592000000}

  security:
    trusted-proxies: ${SECURITY_TRUSTED_PROXIES}

  # CORS (best practice S5). Exact origins only — "*" is refused at startup because every request
  # carries the Authorization header, and the CORS spec forbids a wildcard on credentialed requests.
  # Override per environment with CORS_ALLOWED_ORIGINS (comma-separated).
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PATCH,PUT,DELETE,OPTIONS}
    # Idempotency-Key and X-Plant-Id are ours; without them the browser blocks the preflight of
    # every sensitive POST and every plant-scoped call.
    allowed-headers: ${CORS_ALLOWED_HEADERS:Authorization,Content-Type,Idempotency-Key,X-Plant-Id,X-Trace-Id}
    # Response headers the browser hides from JS unless they are exposed explicitly. X-Trace-Id is
    # what the frontend quotes in a bug report; the rate-limit trio is what it needs to back off.
    exposed-headers: ${CORS_EXPOSED_HEADERS:X-Trace-Id,X-RateLimit-Limit,X-RateLimit-Remaining,X-RateLimit-Rule,Retry-After}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}
    max-age-seconds: ${CORS_MAX_AGE_SECONDS:3600}

  # Spreadsheet import. max-rows is a guard on the synchronous apply path: every row is its own
  # transaction, so a file far larger than this would hold an HTTP request open for minutes.
  # Raising it is a decision about moving the apply step off the request thread, not a config tweak.
  data-import:
    max-rows: ${DATA_IMPORT_MAX_ROWS:5000}

  rate-limit:
    enabled: true
    rules:
      - id: global-ip
        scope: IP
        pattern: "/**"
        limit: ${RATE_LIMIT_GLOBAL_IP_LIMIT:200}
        window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
        action: BLOCK

      - id: auth-ip
        scope: IP
        pattern: "/auth/v1/**"
        limit: ${RATE_LIMIT_AUTH_IP_LIMIT:10}
        window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
        action: BLOCK

      - id: auth-refresh-ip
        scope: IP
        pattern: "/auth/v1/refresh"
        limit: ${RATE_LIMIT_REFRESH_IP_LIMIT:20}
        window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
        action: BLOCK

      - id: global-user
        scope: USER
        pattern: "/**"
        limit: ${RATE_LIMIT_GLOBAL_USER_LIMIT:500}
        window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
        action: BLOCK
