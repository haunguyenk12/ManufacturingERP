spring:
  config:
    import: optional:file:.env[.properties]

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        generate_statistics: true   # detect N+1

  flyway:
    enabled: true

logging:
  level:
    root: INFO
    com.erp.manufacturing: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

app:
  jwt:
    access-token-expiry-ms: 3600000   # 1 hour for easier dev
    refresh-token-expiry-ms: 604800000
    absolute-session-timeout-ms: 2592000000   # 30 days
