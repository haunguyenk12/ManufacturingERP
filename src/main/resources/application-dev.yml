spring:
  config:
    import: optional:file:.env[.properties]

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        generate_statistics: true   # detect N+1

  flyway:
    enabled: true

# Log levels and JWT lifetimes are NOT set here: a profile file outranks application.yml, so a value
# hard-coded in this file silently disabled the matching LOG_LEVEL_* / JWT_* variable in .env.
logging:
  level:
    org.hibernate.engine.internal.StatisticalLoggingSessionEventListener: WARN
